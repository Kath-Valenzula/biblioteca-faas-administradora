name: Deploy servicio-libros a Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'servicio-libros/**'
      - '.github/workflows/deploy-servicio-libros.yml'
  workflow_dispatch:

env:
  ACA_NAME: servicio-libros-kath2026
  ACA_RG: rg-biblioteca-kath2026
  IMAGE_NAME: servicio-libros

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restaurar Oracle Wallet desde secret
        # ORACLE_WALLET_BASE64: tar -czf - -C servicio-libros/src/main/resources wallet | base64
        run: |
          mkdir -p servicio-libros/src/main/resources/wallet
          echo "${{ secrets.ORACLE_WALLET_BASE64 }}" \
            | base64 --decode \
            | tar -xz -C servicio-libros/src/main/resources

      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login al ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build y push imagen Docker
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE" ./servicio-libros
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy a Azure Container Apps
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name ${{ env.ACA_NAME }} \
            --resource-group ${{ env.ACA_RG }} \
            --image ${{ env.IMAGE }}
